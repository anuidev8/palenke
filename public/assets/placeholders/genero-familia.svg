<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b1fa2;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="120" fill="url(#accentGradient)"/>
  <circle cx="1000" cy="650" r="150" fill="url(#accentGradient)"/>

  <!-- Icons representing different aspects of the module -->
  <!-- Female symbol (women) -->
  <g transform="translate(300, 250)">
    <!-- Circle for head -->
    <circle cx="0" cy="-30" r="25" fill="#7b1fa2" opacity="0.8"/>
    <!-- Body -->
    <path d="M -15 0 L -15 60 M 15 0 L 15 60 M 0 0 L 0 50 M -15 25 L 15 25"
          stroke="#7b1fa2" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Family/Multiple people -->
  <g transform="translate(600, 300)">
    <!-- Person 1 -->
    <circle cx="-40" cy="-30" r="20" fill="#9c27b0" opacity="0.7"/>
    <path d="M -40 -10 L -40 40 M -55 5 L -25 5 M -40 40 L -50 70 M -40 40 L -30 70"
          stroke="#9c27b0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Person 2 (center) -->
    <circle cx="0" cy="-35" r="25" fill="#7b1fa2" opacity="0.9"/>
    <path d="M 0 -10 L 0 45 M -20 5 L 20 5 M 0 45 L -10 75 M 0 45 L 10 75"
          stroke="#7b1fa2" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- Person 3 -->
    <circle cx="40" cy="-30" r="20" fill="#9c27b0" opacity="0.7"/>
    <path d="M 40 -10 L 40 40 M 25 5 L 55 5 M 40 40 L 30 70 M 40 40 L 50 70"
          stroke="#9c27b0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Heart symbol (care) -->
  <g transform="translate(900, 250)">
    <path d="M 0 -10 C -20 -30, -40 -20, -40 0 C -40 20, 0 50, 0 50 C 0 50, 40 20, 40 0 C 40 -20, 20 -30, 0 -10 Z"
          fill="#7b1fa2" opacity="0.8"/>
  </g>

  <!-- Generational continuity - curved arrows -->
  <g transform="translate(450, 550)">
    <path d="M -30 0 Q 0 -30 30 0" stroke="#7b1fa2" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <polygon points="35,0 25,-8 28,8" fill="#7b1fa2" opacity="0.6"/>
  </g>

  <!-- Youth symbol - upward arrow -->
  <g transform="translate(750, 500)">
    <line x1="0" y1="30" x2="0" y2="-30" stroke="#9c27b0" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <polygon points="0,-30 -12,-8 12,-8" fill="#9c27b0" opacity="0.7"/>
  </g>

  <!-- Decorative lines -->
  <line x1="50" y1="650" x2="350" y2="650" stroke="#7b1fa2" stroke-width="3" opacity="0.2"/>
  <line x1="850" y1="700" x2="1150" y2="700" stroke="#7b1fa2" stroke-width="3" opacity="0.2"/>

  <!-- Title area -->
  <rect x="150" y="50" width="900" height="100" fill="white" rx="20" opacity="0.7"/>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        text-anchor="middle" fill="#7b1fa2" opacity="0.9">
    Género, Generación y Familia
  </text>
</svg>