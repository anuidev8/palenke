<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@800;900&amp;family=Poppins:wght@600;700&amp;family=Open+Sans:wght@300;400&amp;display=swap');
      .font-palenke { font-family: 'Montserrat', sans-serif; font-weight: 900; letter-spacing: 0.05em; }
      .font-pensamiento { font-family: 'Poppins', sans-serif; font-weight: 700; letter-spacing: 0.02em; }
      .font-descriptor { font-family: 'Open Sans', sans-serif; font-weight: 400; letter-spacing: 0.25em; }
    </style>
    
    <!-- Clipping to keep the inner graphics bounded in the main circle -->
    <clipPath id="circleClip">
      <circle cx="220" cy="200" r="145" />
    </clipPath>
  </defs>

  <!-- Background (Off-white cálido) -->
  <rect width="100%" height="100%" fill="#F8F4E6" />

  <!-- ==================== LOGO SYMBOL ==================== -->
  
  <!-- Outer Technical Ring (Nodos/Plataforma) -->
  <circle cx="220" cy="200" r="162" fill="none" stroke="#1A5F3A" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
  
  <!-- Base Circle (Comunidad Organizada) -->
  <circle cx="220" cy="200" r="150" fill="#FFFFFF" stroke="#000000" stroke-width="10"/>

  <!-- Content Layer Inside the Circle -->
  <g clip-path="url(#circleClip)">
    
    <!-- Background Sky/Space -->
    <rect x="50" y="50" width="340" height="300" fill="#FBF8F1" />

    <!-- Technical/GIS Network in Sky (Territorio Digital) -->
    <g id="sky-nodes" stroke="#C8102E" stroke-width="1.5" stroke-dasharray="4 3">
      <line x1="110" y1="90" x2="200" y2="70" />
      <line x1="200" y1="70" x2="300" y2="100" />
      <line x1="110" y1="90" x2="150" y2="150" />
      <line x1="200" y1="70" x2="150" y2="150" />
      <line x1="200" y1="70" x2="270" y2="160" />
      <line x1="300" y1="100" x2="270" y2="160" />
      <line x1="150" y1="150" x2="270" y2="160" />
    </g>

    <!-- Node Dots -->
    <g fill="#CC5500">
      <circle cx="110" cy="90" r="5" />
      <circle cx="200" cy="70" r="6" />
      <circle cx="300" cy="100" r="5" />
    </g>

    <!-- Mountain 1 (Verde Bosque - ACC) -->
    <path d="M 50,320 L 150,150 L 250,320 Z" fill="#1A5F3A"/>
    <path d="M 150,150 L 150,320 L 250,320 Z" fill="#12452A"/> <!-- Shadow for depth -->

    <!-- Mountain 2 (Piedra - Territorio Sólido) -->
    <path d="M 170,320 L 270,160 L 370,320 Z" fill="#8B7355"/>
    <path d="M 270,160 L 270,320 L 370,320 Z" fill="#6E5A42"/> <!-- Shadow for depth -->

    <!-- Peak Nodes overlaying Mountains -->
    <circle cx="150" cy="150" r="6" fill="#1A5F3A" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="270" cy="160" r="6" fill="#8B7355" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Water Sources (Cuencas Hídricas) -->
    <path d="M 50,260 Q 135,240 220,260 T 390,260 L 390,350 L 50,350 Z" fill="#2E86AB" opacity="0.9"/>
    <path d="M 50,285 Q 135,265 220,285 T 390,285 L 390,350 L 50,350 Z" fill="#1D5B75" opacity="0.9"/>

    <!-- Network connection from Community to Mountains -->
    <!-- (These lines come from the central figure's chest below) -->
    <line x1="220" y1="325" x2="150" y2="150" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 4"/>
    <line x1="220" y1="325" x2="270" y2="160" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 4"/>

    <!-- Organized Community (3 Stylized Figures) -->
    <!-- Center Figure (Liderazgo/Gobierno) -->
    <path d="M 160,360 C 160,305 280,305 280,360 Z" fill="#000000"/>
    <circle cx="220" cy="275" r="18" fill="#000000"/>
    <!-- Glowing Chest Node (Memoria/Corazón Digital) -->
    <circle cx="220" cy="325" r="7" fill="#C8102E" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Left Figure -->
    <path d="M 100,360 C 100,315 200,315 200,360 Z" fill="#000000"/>
    <circle cx="150" cy="295" r="14" fill="#000000"/>

    <!-- Right Figure -->
    <path d="M 240,360 C 240,315 340,315 340,360 Z" fill="#000000"/>
    <circle cx="290" cy="295" r="14" fill="#000000"/>

  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  
  <g transform="translate(420, 195)">
    <!-- Main "PALENKE" -->
    <text x="0" y="0" class="font-palenke" font-size="86" fill="#000000">PALENKE</text>
    
    <!-- Secondary "PENSAMIENTO" -->
    <text x="5" y="55" class="font-pensamiento" font-size="44" fill="#1A5F3A">PENSAMIENTO</text>
    
    <!-- Decorative Line (Lucha/Fuerza) -->
    <line x1="8" y1="80" x2="130" y2="80" stroke="#C8102E" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Descriptor "PLATAFORMA PCN" -->
    <text x="8" y="115" class="font-descriptor" font-size="20" fill="#000000">PLATAFORMA PCN</text>
  </g>

</svg>
